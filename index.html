<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>诗词赏析 - 春晓</title>
    <style>
        /* 页面整体样式 */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #fcfaf2; /* 宣纸色背景 */
            font-family: "STSong", "Songti SC", "SimSun", serif; /* 优先使用宋体，更有韵味 */
            color: #333;
        }

        /* 诗歌容器 */
        .poem-container {
            text-align: center;
            padding: 40px;
            border: 1px solid #dcdcdc;
            background-color: #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            max-width: 90%;
        }

        /* 标题 */
        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            letter-spacing: 0.5rem;
            color: #2c3e50;
        }

        /* 作者 */
        .author {
            font-size: 1.1rem;
            color: #888;
            margin-bottom: 2rem;
            letter-spacing: 0.2rem;
        }

        /* 诗句内容 */
        .content {
            font-size: 1.8rem;
            line-height: 2.5;
            letter-spacing: 0.3rem;
            writing-mode: horizontal-tb; /* 可改为 vertical-rl 变为竖排版 */
        }

        /* 装饰线 */
        .divider {
            width: 50px;
            height: 2px;
            background-color: #e67e22;
            margin: 20px auto;
        }

        /* 响应式调整 */
        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; }
            .content { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

    <div class="poem-container">
        <h1>春晓</h1>
        <div class="author">[唐] 孟浩然</div>
        <div class="divider"></div>
        <div class="content">
            春眠不觉晓，<br>
            处处闻啼鸟。<br>
            夜来风雨声，<br>
            花落知多少。
        </div>
    </div>

</body>
</html>
